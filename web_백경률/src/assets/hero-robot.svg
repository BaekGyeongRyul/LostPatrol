<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460" role="img" aria-label="LostPatrol 순찰 로봇 일러스트">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbe3f0" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3f8f" />
      <stop offset="100%" stop-color="#0b1224" />
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16305c" />
      <stop offset="100%" stop-color="#0a1830" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="lightGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#eaf1ff" />
      <stop offset="55%" stop-color="#9fb8ea" />
      <stop offset="100%" stop-color="#16305c" />
    </radialGradient>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>

  <!-- 그림자 -->
  <ellipse cx="200" cy="430" rx="120" ry="16" fill="#000000" opacity="0.28" />

  <!-- 하단 받침부 -->
  <rect x="70" y="330" width="260" height="78" rx="38" fill="url(#baseGrad)" />

  <!-- 앞바퀴 -->
  <circle cx="112" cy="400" r="34" fill="#0d1220" />
  <circle cx="112" cy="400" r="34" fill="none" stroke="#2c4a86" stroke-width="3" opacity="0.6" />
  <circle cx="112" cy="400" r="12" fill="#3a5686" />
  <circle cx="288" cy="400" r="34" fill="#0d1220" />
  <circle cx="288" cy="400" r="34" fill="none" stroke="#2c4a86" stroke-width="3" opacity="0.6" />
  <circle cx="288" cy="400" r="12" fill="#3a5686" />

  <!-- 몸체 -->
  <rect x="58" y="150" width="284" height="200" rx="60" fill="url(#bodyGrad)" />

  <!-- 네온 라이트 띠 (글로우 + 본체) -->
  <rect x="46" y="318" width="308" height="26" rx="13" fill="url(#neonGrad)" filter="url(#softBlur)" opacity="0.75" />
  <rect x="54" y="322" width="292" height="18" rx="9" fill="url(#neonGrad)" />

  <!-- 상단 캡 -->
  <path d="M92 150 C92 96 138 62 200 62 C262 62 308 96 308 150 Z" fill="url(#capGrad)" />

  <!-- 상단 경광등 라이트 (글로우 + 본체) -->
  <rect x="150" y="70" width="100" height="16" rx="8" fill="url(#lightGrad)" filter="url(#softBlur)" opacity="0.85" />
  <rect x="156" y="73" width="88" height="10" rx="5" fill="url(#lightGrad)" />

  <!-- 센서 눈 -->
  <circle cx="150" cy="220" r="34" fill="#0d1220" />
  <circle cx="150" cy="220" r="27" fill="url(#eyeGlow)" />
  <circle cx="141" cy="210" r="6" fill="#ffffff" opacity="0.9" />

  <circle cx="250" cy="220" r="34" fill="#0d1220" />
  <circle cx="250" cy="220" r="27" fill="url(#eyeGlow)" />
  <circle cx="241" cy="210" r="6" fill="#ffffff" opacity="0.9" />

  <!-- 상단 보조 센서 점 -->
  <circle cx="178" cy="172" r="6" fill="#16305c" opacity="0.5" />
  <circle cx="222" cy="172" r="6" fill="#16305c" opacity="0.5" />

  <!-- LostPatrol 브랜딩 플레이트 -->
  <rect x="118" y="270" width="164" height="34" rx="17" fill="#eef2fb" stroke="#c9d5ec" stroke-width="1.5" />
  <text
    x="200"
    y="292"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="700"
    letter-spacing="0.5"
    fill="#16305c"
  >LostPatrol</text>
</svg>
